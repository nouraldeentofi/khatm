name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      # xmllint: independent C14N 1.1 reference for the canonicalization tests.
      - run: sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # SDK-backed checks run only where tools/zatca-sdk is present (locally for now).
      - run: pnpm test
