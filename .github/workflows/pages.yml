name: pages
# Builds the public demo (apps/demo) and publishes it to the gh-pages branch.
# Manual only: Chrome's Safe Browsing flagged the github.io copy (a new page on a free
# host that names ZATCA and asks for tax numbers looks like phishing to its classifier).
# The demo goes back up on the product's own domain.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @khatm/demo build
      - name: Publish to gh-pages
        working-directory: apps/demo/dist/site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Deploy demo from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
