# Local development only. Production runs on a VPS inside the Kingdom (see the plan, §5).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: fatoora }
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]
volumes: { pg_data: {} }
